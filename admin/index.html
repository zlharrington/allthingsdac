<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Photo Manager | All Things Drywall & Construction</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="admin.css"><script defer src="admin.js"></script></head><body class="admin-body"><main class="admin-shell"><header class="admin-head"><div><span class="eyebrow">Owner tools</span><h1>Project photo manager</h1><p>Upload project photos, add a short label, and choose which images appear on the public Our Work page.</p></div><a class="btn btn-outline" href="../work.html">View public gallery</a></header><section class="admin-panel"><h2>Upload photos</h2><form id="uploadForm" class="upload-form"><label>Photos<input id="files" name="files" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple required></label><label>Project name<input id="title" name="title" type="text" maxlength="120" placeholder="KIA of Tri-Cities"></label><label>Category<select id="category" name="category"><option>Commercial</option><option>Government</option><option>Industrial</option><option>Residential</option><option>Project</option></select></label><label>Alt text<input id="alt" name="alt" type="text" maxlength="180" placeholder="Describe what is visible in the photo"></label><label class="check-row"><input id="published" name="published" type="checkbox" checked> Publish after upload</label><button class="btn btn-primary" type="submit">Upload selected photos</button></form><p id="status" class="admin-status" role="status" aria-live="polite"></p></section><section class="admin-panel"><div class="admin-section-head"><div><span class="eyebrow">Gallery</span><h2>Uploaded photos</h2></div><button id="refresh" class="btn btn-outline" type="button">Refresh</button></div><div id="photoGrid" class="admin-grid"><p>Loading photos…</p></div></section></main></body></html>
