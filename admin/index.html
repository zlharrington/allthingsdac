<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Project Manager | All Things Drywall & Construction</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="admin.css"><script defer src="admin.js"></script></head><body class="admin-body"><main class="admin-shell"><header class="admin-head"><div><span class="eyebrow">Owner tools</span><h1>Project gallery manager</h1><p>Create Residential, Commercial, or Federal projects, then upload photos into the correct project gallery.</p></div><div class="admin-head-actions"><a class="btn btn-outline" href="../work.html">View project pages</a><a class="btn btn-outline" href="/api/admin/logout">Log out</a></div></header><section class="admin-panel"><div class="admin-section-head"><div><span class="eyebrow">Step 1</span><h2>Create a project</h2></div></div><form id="projectForm" class="project-form"><label>Project name<input id="projectName" type="text" maxlength="120" placeholder="KIA of Tri-Cities" required></label><label>Job type<select id="projectJobType" required><option value="commercial">Commercial</option><option value="residential">Residential</option><option value="federal">Federal</option></select></label><label>Short description<input id="projectDescription" type="text" maxlength="240" placeholder="Optional project summary"></label><button class="btn btn-dark" type="submit">Create project</button></form><p id="projectStatus" class="admin-status" role="status" aria-live="polite"></p><div id="projectList" class="project-list"><p>Loading projects…</p></div></section><section class="admin-panel"><div class="admin-section-head"><div><span class="eyebrow">Step 2</span><h2>Upload photos</h2></div></div><form id="uploadForm" class="upload-form"><label>Photos<input id="files" name="files" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple required></label><label>Job type<select id="jobType" name="jobType" required><option value="commercial">Commercial</option><option value="residential">Residential</option><option value="federal">Federal</option></select></label><label>Project<select id="projectId" name="projectId" required><option value="">Create a project first</option></select></label><label>Photo label<input id="title" name="title" type="text" maxlength="120" placeholder="Optional photo label"></label><label>Alt text<input id="alt" name="alt" type="text" maxlength="180" placeholder="Describe what is visible in the photo"></label><label class="check-row"><input id="published" name="published" type="checkbox" checked> Publish after upload</label><button class="btn btn-primary" type="submit">Upload selected photos</button></form><p id="status" class="admin-status" role="status" aria-live="polite"></p></section><section class="admin-panel"><div class="admin-section-head"><div><span class="eyebrow">Photos</span><h2>Uploaded photos</h2></div><button id="refresh" class="btn btn-outline" type="button">Refresh</button></div><div id="photoGrid" class="admin-grid"><p>Loading photos…</p></div></section></main></body></html>
