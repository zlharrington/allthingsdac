<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Login | All Things Drywall & Construction</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-body"><main class="admin-shell" style="max-width:560px;min-height:100vh;display:grid;align-items:center"><section class="admin-panel"><div class="admin-section-head"><div><span class="eyebrow">Client access</span><h1 style="margin-bottom:8px">Project gallery login</h1><p>Sign in to upload and manage project photos.</p></div></div><form id="loginForm" class="upload-form" autocomplete="on"><label>Username<input id="username" name="username" type="text" autocomplete="username" required autofocus></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary" type="submit">Sign in</button></form><p id="loginStatus" class="admin-status" role="status" aria-live="polite"></p><p><a href="../index.html">← Back to website</a></p></section></main><script>const form=document.getElementById('loginForm'),statusEl=document.getElementById('loginStatus');form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;statusEl.textContent='Signing in…';statusEl.classList.remove('error');try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Login failed.');window.location.replace('/admin/');}catch(error){statusEl.textContent=error.message;statusEl.classList.add('error');}finally{button.disabled=false;}});</script></body></htm
